[project]
name = "wunschplan"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# HTML- und CSS-Vorlagen in der Oberfläche
"streamlit_app.py" = ["E501"]
